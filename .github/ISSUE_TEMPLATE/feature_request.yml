name: 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议！请尽量说明**你想解决什么问题**，
        而不只是「想要什么功能」——这样更容易讨论出合适的方案。

  - type: dropdown
    id: component
    attributes:
      label: 涉及模块
      options:
        - 记忆 CRUD（remember / recall / get / update / forget）
        - 批量写入（batch）
        - 知识图谱（三元组 / 多跳 BFS）
        - 记忆归档（sleep）
        - 噪声审计与清理（hygiene）
        - 临时便签（scratchpad）
        - 工具路由（_dispatch）
        - MCP 传输（stdio / SSE）
        - CLI
        - 文档 / 示例 / CI / 依赖
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述问题场景，而不是直接给实现方案
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你想到的解法，或可选的几种方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 有没有别的路可以走？现成工具（如 mem0 / Letta）能解决吗？
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，没有找到相同建议
          required: true
